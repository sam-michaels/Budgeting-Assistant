services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: budgetassistant
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budgetassistant"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Schema changes run as their own step, never on app startup. The entrypoint is
  # `dotnet BudgetAssistant.Web.dll`, so `command` just appends the flag.
  migrate:
    image: budget-assistant
    build: .
    command: ["--migrate"]
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=budgetassistant;Username=budget;Password=localdev"
    depends_on:
      db:
        condition: service_healthy

  app:
    image: budget-assistant
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=budgetassistant;Username=budget;Password=localdev"
      # A container's localhost is the container. Ollama runs on the host, if at all.
      Insights__Ollama__BaseUrl: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
