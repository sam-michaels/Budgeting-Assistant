services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: budgetassistant
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budgetassistant"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
